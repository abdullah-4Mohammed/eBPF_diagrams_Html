<svg width="1140" height="590" viewBox="0 0 1140 590" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrow definitions -->
  <defs>
    <marker id="blue-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#2196f3"/>
    </marker>
    <marker id="orange-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#ff9800"/>
    </marker>
    <marker id="purple-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#673ab7"/>
    </marker>
    <marker id="green-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#4caf50"/>
    </marker>
    <marker id="teal-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#26a69a"/>
    </marker>
  </defs>
  
  <!-- PART 1: OUTBOUND TRAFFIC FLOW -->
  <g id="part1" transform="translate(0, 20)">
    <!-- Title -->
    <text x="570" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">Part 1: Outbound Traffic Flow - Network Policy Enforcement</text>
    <text x="570" y="50" text-anchor="middle" font-size="14" fill="#666" font-family="Arial, sans-serif">How Cilium enforces network policies on egress traffic</text>
    
    <!-- Single unified background for entire Part 1 -->
    <rect x="70" y="70" width="1070" height="100" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="605" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60" font-family="Arial, sans-serif">Userspace Applications</text>
    
    <rect x="70" y="190" width="1070" height="290" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
    <text x="605" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">Kernel Space</text>
    
    <!-- Applications -->
    <rect x="100" y="100" width="140" height="50" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="170" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">Frontend Pod</text>
    <text x="170" y="135" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Sends network traffic</text>
    
    <rect x="960" y="100" width="140" height="50" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
    <text x="1030" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">Cilium Agent</text>
    <text x="1030" y="135" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Policy Controller</text>
    
    <!-- Kernel Components -->
    <rect x="100" y="230" width="140" height="50" fill="#ff7043" stroke="#d84315" stroke-width="2" rx="5"/>
    <text x="170" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">tc egress</text>
    <text x="170" y="265" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Traffic Control Hook</text>
    
    <rect x="300" y="230" width="140" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="370" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">Cilium eBPF</text>
    <text x="370" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">Program (CeP)</text>
    <text x="370" y="270" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Packet Parsing</text>
    <text x="370" y="280" text-anchor="middle" font-size="7" fill="white" font-family="Arial, sans-serif">bpf_skb_load_bytes()</text>
    
    <rect x="520" y="230" width="140" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="590" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">CeP Policy Check</text>
    <text x="590" y="260" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Verify Connection</text>
    <text x="590" y="275" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">bpf_map_lookup_elem()</text>
    
    <rect x="740" y="230" width="140" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="810" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">CeP Policy Decision</text>
    <text x="810" y="260" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Allow / Drop Traffic</text>
    <text x="810" y="275" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">TC_ACT_OK / TC_ACT_SHOT</text>
    
    <!-- Network Stack in Kernel -->
    <rect x="960" y="230" width="140" height="50" fill="#ff9800" stroke="#f57c00" stroke-width="2" rx="5"/>
    <text x="1030" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">Network Stack</text>
    <text x="1030" y="265" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Packet Transmission</text>
    <text x="1030" y="280" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Egress to Backend</text>
    
    <!-- Lower Row Blocks -->
    <!-- eBPF Maps in Kernel -->
    <rect x="300" y="330" width="140" height="50" fill="#26a69a" stroke="#00695c" stroke-width="2" rx="5"/>
    <text x="370" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">eBPF Maps</text>
    <text x="370" y="365" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Policy Storage</text>
    <text x="370" y="380" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Kernel Memory</text>
    
    <rect x="740" y="330" width="140" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="810" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">CeP Flow Observability</text>
    <text x="810" y="355" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Metrics Collection</text>
    <text x="810" y="368" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Record Generation</text>
    <text x="810" y="381" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Lifecycle Tracking</text>
    
    <!-- Flow Arrows -->
    <line x1="170" y1="150" x2="170" y2="230" stroke="#4caf50" stroke-width="3" marker-end="url(#green-arrow)"/>
    <text x="170" y="180" text-anchor="middle" font-size="9" fill="#4caf50" font-weight="bold" font-family="Arial, sans-serif">traffic</text>
    <circle cx="170" cy="190" r="8" fill="#fff" stroke="#4caf50" stroke-width="2"/>
    <text x="170" y="195" text-anchor="middle" font-size="9" font-weight="bold" fill="#4caf50" font-family="Arial, sans-serif">1</text>
    
    <line x1="240" y1="255" x2="300" y2="255" stroke="#ff7043" stroke-width="3" marker-end="url(#orange-arrow)"/>
    <text x="270" y="275" text-anchor="middle" font-size="9" fill="#ff7043" font-weight="bold" font-family="Arial, sans-serif">triggers</text>
    <circle cx="270" cy="255" r="8" fill="#fff" stroke="#ff7043" stroke-width="2"/>
    <text x="270" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff7043" font-family="Arial, sans-serif">2</text>
    
    <line x1="440" y1="255" x2="520" y2="255" stroke="#2196f3" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <text x="480" y="275" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif">executes</text>
    <circle cx="480" cy="255" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
    <text x="480" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">3</text>
    
    <!-- Simultaneous arrow to Flow Observability -->
    <line x1="440" y1="275" x2="740" y2="355" stroke="#2196f3" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <text x="590" y="310" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(15 590 310)">observes</text>
    <circle cx="590" cy="315" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
    <text x="590" y="320" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">3</text>
    
    <!-- Connect Policy Check to eBPF Maps -->
    <line x1="520" y1="275" x2="440" y2="345" stroke="#26a69a" stroke-width="2" marker-end="url(#teal-arrow)"/>
    <text x="460" y="315" font-size="9" fill="#26a69a" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(-55 460 315)">reads</text>
    <circle cx="480" cy="310" r="8" fill="#fff" stroke="#26a69a" stroke-width="2"/>
    <text x="480" y="315" text-anchor="middle" font-size="9" font-weight="bold" fill="#26a69a" font-family="Arial, sans-serif">4</text>
    
    <line x1="660" y1="255" x2="740" y2="255" stroke="#2196f3" stroke-width="3" marker-end="url(#blue-arrow)"/>
    <text x="700" y="275" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif">decides</text>
    <circle cx="700" cy="255" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
    <text x="700" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">5</text>
    
    <!-- Connect Policy Decision to Flow Observability -->
    <line x1="810" y1="280" x2="810" y2="330" stroke="#2196f3" stroke-width="2" marker-end="url(#blue-arrow)"/>
    <text x="795" y="305" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(-90 795 305)">verdict</text>
    <circle cx="810" cy="305" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
    <text x="810" y="310" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">6</text>
    
    <!-- Connect Policy Decision to Network Stack -->
    <line x1="880" y1="255" x2="960" y2="255" stroke="#ff9800" stroke-width="3" marker-end="url(#orange-arrow)"/>
    <text x="920" y="275" text-anchor="middle" font-size="9" fill="#ff9800" font-weight="bold" font-family="Arial, sans-serif">forwards</text>
    <circle cx="920" cy="255" r="8" fill="#fff" stroke="#ff9800" stroke-width="2"/>
    <text x="920" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff9800" font-family="Arial, sans-serif">7</text>
    
    <!-- Connect Flow Observability to Cilium Agent for flow statistics -->
    <line x1="810" y1="330" x2="1030" y2="150" stroke="#2196f3" stroke-width="2" marker-end="url(#blue-arrow)"/>
    <text x="950" y="185" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(-35 950 185)">export flow data</text>
    <circle cx="960" cy="200" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
    <text x="960" y="205" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">8</text>
    
    <!-- Process Flow Labels - now inside blue background -->
    <text x="605" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e" font-family="Arial, sans-serif">Process Flow:</text>
    <text x="120" y="405" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">1. Frontend Pod sends network traffic</text>
    <text x="120" y="420" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">2. tc egress hook intercepts the traffic</text>
    <text x="120" y="435" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">3. Cilium eBPF program triggered by hook point</text>
    <text x="120" y="450" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">4. Cilium eBPF program parses packet headers and extracts metadata</text>
    <text x="120" y="465" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">5. eBPF program triggers flow observability (simultaneous)</text>
    <text x="635" y="405" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">6. Policy check reads policies from eBPF Maps</text>
    <text x="635" y="420" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">7. Policy check makes policy decision</text>
    <text x="635" y="435" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">8. Policy decision provides verdict to flow observability</text>
    <text x="635" y="450" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">9. Policy decision forwards allowed packet to Network Stack</text>
    <text x="635" y="465" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">10. Flow observability exports complete data to Cilium Agent</text>
  </g>
  
  <!-- COLOR LEGEND -->
  <g transform="translate(150, 520)">
    <text x="420" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" font-family="Arial, sans-serif">Color Legend</text>
    
    <!-- Row 1 -->
    <rect x="0" y="15" width="18" height="15" fill="#4caf50" stroke="#2e7d32" stroke-width="1" rx="3"/>
    <text x="25" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">Userspace Applications</text>
    
    <rect x="200" y="15" width="18" height="15" fill="#26a69a" stroke="#00695c" stroke-width="1" rx="3"/>
    <text x="225" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">eBPF Maps (Kernel Storage)</text>
    
    <rect x="420" y="15" width="18" height="15" fill="#ff7043" stroke="#d84315" stroke-width="1" rx="3"/>
    <text x="445" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">Traffic Control Hooks</text>
    
    <rect x="640" y="15" width="18" height="15" fill="#ff9800" stroke="#f57c00" stroke-width="1" rx="3"/>
    <text x="665" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">Network Stack</text>
    
    <!-- Row 2 -->
    <rect x="100" y="40" width="18" height="15" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="3"/>
    <text x="125" y="51" font-size="11" fill="#333" font-family="Arial, sans-serif">Cilium eBPF Program and Its Functions</text>
  </g>
  
  <!-- Attribution -->
  <text x="980" y="580" font-size="10" fill="#7f8c8d" font-style="italic" font-family="Arial, sans-serif">Abdullah Mohammed</text>
</svg>