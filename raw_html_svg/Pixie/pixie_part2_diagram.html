<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixie Part 2: Inbound Request Processing</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .diagram {
            width: 100%;
            max-width: 1140px;
            height: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #1a237e;
            margin: 0 0 10px 0;
        }
        .header p {
            color: #666;
            margin: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Pixie Part 2: Inbound Request Processing</h1>
            <p>Trace ID Extraction and Service Correlation</p>
        </div>
        
        <svg class="diagram" width="1140" height="650" viewBox="0 0 1140 650" xmlns="http://www.w3.org/2000/svg">
          <!-- Arrow definitions -->
          <defs>
            <marker id="blue-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#2196f3"/>
            </marker>
            <marker id="orange-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#ff9800"/>
            </marker>
            <marker id="purple-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#673ab7"/>
            </marker>
            <marker id="green-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#4caf50"/>
            </marker>
            <marker id="teal-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#26a69a"/>
            </marker>
          </defs>
          
          <!-- PIXIE INBOUND PROCESSING -->
          <g id="pixie-inbound" transform="translate(0, 20)">
            <!-- Title -->
            <text x="570" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">Part 2: Inbound Request Processing - Trace ID Extraction & Correlation</text>
            <text x="570" y="50" text-anchor="middle" font-size="14" fill="#666" font-family="Arial, sans-serif">How Pixie extracts trace IDs from incoming requests and correlates with services</text>
            
            <!-- Background layers -->
            <rect x="70" y="70" width="1070" height="100" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="8"/>
            <text x="605" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60" font-family="Arial, sans-serif">Userspace Applications</text>
            
            <rect x="70" y="190" width="1070" height="320" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
            <text x="605" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">Kernel Space</text>
            
            <!-- Applications -->
            <rect x="960" y="100" width="140" height="50" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
            <circle cx="975" cy="115" r="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
            <text x="975" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">1</text>
            <text x="1030" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">Backend Service</text>
            <text x="1030" y="135" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Receives HTTP Request</text>
            
            <rect x="100" y="100" width="140" height="50" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
            <circle cx="115" cy="115" r="10" fill="#2e7d32" stroke="#1b5e20" stroke-width="1"/>
            <text x="115" y="120" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">2</text>
            <text x="170" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">Pixie Agent</text>
            <text x="170" y="135" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Trace Correlation</text>
            
            <!-- Kernel Components -->
            <rect x="100" y="230" width="140" height="50" fill="#ff9800" stroke="#f57c00" stroke-width="2" rx="5"/>
            <circle cx="115" cy="245" r="10" fill="#f57c00" stroke="#ef6c00" stroke-width="1"/>
            <text x="115" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">3</text>
            <text x="170" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">Network Interface</text>
            <text x="170" y="255" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Packet Arrival</text>
            <text x="170" y="270" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">netif_receive_skb</text>
            
            <rect x="300" y="230" width="140" height="50" fill="#ff7043" stroke="#d84315" stroke-width="2" rx="5"/>
            <circle cx="315" cy="245" r="10" fill="#d84315" stroke="#bf360c" stroke-width="1"/>
            <text x="315" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">4</text>
            <text x="370" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">tracepoint/net</text>
            <text x="370" y="255" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Packet Interception</text>
            <text x="370" y="270" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">netif_receive_skb</text>
            
            <rect x="520" y="230" width="140" height="60" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
            <circle cx="535" cy="245" r="10" fill="#1976d2" stroke="#0d47a1" stroke-width="1"/>
            <text x="535" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">5</text>
            <text x="590" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">Pixie eBPF</text>
            <text x="590" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">Program (PeP)</text>
            <text x="590" y="270" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">HTTP Header Parsing</text>
            <text x="590" y="284" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Extract X-Trace-ID</text>
            
            <rect x="740" y="230" width="140" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
            <circle cx="755" cy="245" r="10" fill="#1976d2" stroke="#0d47a1" stroke-width="1"/>
            <text x="755" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">6</text>
            <text x="810" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">PeP Process</text>
            <text x="810" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">Correlation</text>
            <text x="810" y="270" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Link Trace to Service</text>
            
            <!-- Receive Handler -->
            <rect x="960" y="230" width="140" height="50" fill="#ff9800" stroke="#f57c00" stroke-width="2" rx="5"/>
            <circle cx="975" cy="245" r="10" fill="#f57c00" stroke="#ef6c00" stroke-width="1"/>
            <text x="975" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">7</text>
            <text x="1030" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">Receive Handler</text>
            <text x="1030" y="260" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Application Layer</text>
            <text x="1030" y="275" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Request Processing</text>
            
            <!-- Lower Row Blocks -->
            <!-- eBPF Maps - MOVED to block 9's position -->
            <rect x="740" y="330" width="140" height="50" fill="#26a69a" stroke="#00695c" stroke-width="2" rx="5"/>
            <circle cx="755" cy="345" r="10" fill="#00695c" stroke="#004d40" stroke-width="1"/>
            <text x="755" y="350" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">8</text>
            <text x="810" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">eBPF Maps</text>
            <text x="810" y="360" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Process Metadata</text>
            <text x="810" y="375" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">PID, Container ID, Service</text>
            
            <!-- Trace Storage - MOVED to block 8's position -->
            <rect x="520" y="330" width="140" height="60" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
            <circle cx="535" cy="345" r="10" fill="#1976d2" stroke="#0d47a1" stroke-width="1"/>
            <text x="535" y="350" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">9</text>
            <text x="590" y="342" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">PeP Trace Storage</text>
            <text x="590" y="357" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Store New Trace Context</text>
            <text x="590" y="371" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Trace ID + Service Mapping</text>
            <text x="590" y="385" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">bpf_map_update_elem()</text>
            
            <!-- Flow Arrows -->
            <line x1="240" y1="255" x2="300" y2="255" stroke="#ff9800" stroke-width="3" marker-end="url(#orange-arrow)"/>
            <text x="270" y="245" text-anchor="middle" font-size="9" fill="#ff9800" font-weight="bold" font-family="Arial, sans-serif">triggers</text>
            <circle cx="270" cy="255" r="8" fill="#fff" stroke="#ff9800" stroke-width="2"/>
            <text x="270" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff9800" font-family="Arial, sans-serif">1</text>
            
            <line x1="440" y1="255" x2="520" y2="255" stroke="#ff7043" stroke-width="3" marker-end="url(#orange-arrow)"/>
            <text x="480" y="245" text-anchor="middle" font-size="9" fill="#ff7043" font-weight="bold" font-family="Arial, sans-serif">intercepts</text>
            <circle cx="480" cy="255" r="8" fill="#fff" stroke="#ff7043" stroke-width="2"/>
            <text x="480" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff7043" font-family="Arial, sans-serif">2</text>
            
            <line x1="660" y1="255" x2="740" y2="255" stroke="#2196f3" stroke-width="3" marker-end="url(#blue-arrow)"/>
            <text x="700" y="245" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif">parses</text>
            <circle cx="700" cy="255" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="700" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">3</text>
            
            <!-- Simultaneous arrow to Trace Storage -->
            <line x1="590" y1="290" x2="590" y2="330" stroke="#2196f3" stroke-width="3" marker-end="url(#blue-arrow)"/>
            <text x="565" y="310" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif">correlates</text>
            <circle cx="590" cy="310" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="590" y="315" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">3</text>
            
            <!-- Connect Process Correlation to eBPF Maps -->
            <line x1="810" y1="280" x2="810" y2="330" stroke="#26a69a" stroke-width="2" marker-end="url(#teal-arrow)"/>
            <text x="835" y="295" text-anchor="middle" font-size="9" fill="#26a69a" font-weight="bold" font-family="Arial, sans-serif">reads metadata</text>
            <circle cx="810" cy="305" r="8" fill="#fff" stroke="#26a69a" stroke-width="2"/>
            <text x="810" y="310" text-anchor="middle" font-size="9" font-weight="bold" fill="#26a69a" font-family="Arial, sans-serif">4</text>
            
            <line x1="880" y1="255" x2="960" y2="255" stroke="#ff9800" stroke-width="3" marker-end="url(#orange-arrow)"/>
            <text x="920" y="245" text-anchor="middle" font-size="9" fill="#ff9800" font-weight="bold" font-family="Arial, sans-serif">correlates</text>
            <circle cx="920" cy="255" r="8" fill="#fff" stroke="#ff9800" stroke-width="2"/>
            <text x="920" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff9800" font-family="Arial, sans-serif">5</text>
            
            <!-- Connect Process Correlation to Trace Storage -->
            <line x1="740" y1="255" x2="660" y2="355" stroke="#2196f3" stroke-width="2" marker-end="url(#blue-arrow)"/>
            <text x="690" y="295" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(-50 690 295)">stores trace</text>
            <circle cx="700" cy="305" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="700" y="310" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">6</text>
            
            <!-- Connect Receive Handler to Backend Service -->
            <line x1="1030" y1="230" x2="1030" y2="150" stroke="#4caf50" stroke-width="3" marker-end="url(#green-arrow)"/>
            <text x="1055" y="185" text-anchor="middle" font-size="9" fill="#4caf50" font-weight="bold" font-family="Arial, sans-serif">delivers</text>
            <circle cx="1030" cy="190" r="8" fill="#fff" stroke="#4caf50" stroke-width="2"/>
            <text x="1030" y="195" text-anchor="middle" font-size="9" font-weight="bold" fill="#4caf50" font-family="Arial, sans-serif">7</text>
            
            <!-- Connect Trace Storage to Pixie Agent -->
            <line x1="520" y1="355" x2="240" y2="125" stroke="#2196f3" stroke-width="2" marker-end="url(#blue-arrow)"/>
            <text x="290" y="165" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(-39 290 165)">export trace data</text>
            <circle cx="300" cy="175" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="300" y="180" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">8</text>
            
            <!-- Process Flow Labels -->
            <text x="570" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e" font-family="Arial, sans-serif">Process Flow:</text>
            <text x="120" y="450" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">1. Network interface receives HTTP request with X-Trace-ID header</text>
            <text x="120" y="465" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">2. tracepoint/net intercepts packet arrival event</text>
            <text x="120" y="480" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">3. Pixie eBPF program parses HTTP headers, extracts X-Trace-ID and correlates</text>
            <text x="120" y="495" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">4. Process correlation reads service metadata from eBPF Maps</text>
            <text x="635" y="450" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">5. Process correlation links with receive handler</text>
            <text x="635" y="465" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">6. Process correlation stores trace data in trace storage</text>
            <text x="635" y="480" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">7. Receive handler delivers request to Backend Service</text>
            <text x="635" y="495" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">8. Trace storage exports complete correlation data to Pixie Agent</text>
          </g>
          
          <!-- COLOR LEGEND -->
          <g transform="translate(150, 570)">
            <text x="420" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" font-family="Arial, sans-serif">Color Legend</text>
            
            <!-- Row 1 -->
            <rect x="0" y="15" width="18" height="15" fill="#4caf50" stroke="#2e7d32" stroke-width="1" rx="3"/>
            <text x="25" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">Userspace Applications</text>
            
            <rect x="200" y="15" width="18" height="15" fill="#26a69a" stroke="#00695c" stroke-width="1" rx="3"/>
            <text x="225" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">eBPF Maps (Kernel Storage)</text>
            
            <rect x="420" y="15" width="18" height="15" fill="#ff7043" stroke="#d84315" stroke-width="1" rx="3"/>
            <text x="445" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">Kernel Hooks (tracepoint)</text>
            
            <rect x="640" y="15" width="18" height="15" fill="#ff9800" stroke="#f57c00" stroke-width="1" rx="3"/>
            <text x="665" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">Network & Application Layer</text>
            
            <!-- Row 2 -->
            <rect x="100" y="40" width="18" height="15" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="3"/>
            <text x="125" y="51" font-size="11" fill="#333" font-family="Arial, sans-serif">Pixie eBPF Program and Its Functions</text>
          </g>
          
          <!-- Attribution -->
          <text x="980" y="640" font-size="10" fill="#7f8c8d" font-style="italic" font-family="Arial, sans-serif">Abdullah Mohammed</text>
        </svg>
    </div>
</body>
</html>
