<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixie Part 1: Outbound Request Flow</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 1200px;
            width: 100%;
        }
        .diagram {
            width: 100%;
            max-width: 1140px;
            height: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #1a237e;
            margin: 0 0 10px 0;
        }
        .header p {
            color: #666;
            margin: 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Pixie Part 1: Outbound Request Flow</h1>
            <p>Automatic Trace ID Injection for Distributed Tracing</p>
        </div>
        
        <svg class="diagram" width="1140" height="630" viewBox="0 0 1140 630" xmlns="http://www.w3.org/2000/svg">
          <!-- Arrow definitions -->
          <defs>
            <marker id="blue-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#2196f3"/>
            </marker>
            <marker id="orange-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#ff9800"/>
            </marker>
            <marker id="purple-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#673ab7"/>
            </marker>
            <marker id="green-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#4caf50"/>
            </marker>
            <marker id="teal-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
              <polygon points="0 0, 6 2.5, 0 5" fill="#26a69a"/>
            </marker>
          </defs>
          
          <!-- PIXIE OUTBOUND TRACING -->
          <g id="pixie-outbound" transform="translate(0, 20)">
            <!-- Title -->
            <text x="570" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50" font-family="Arial, sans-serif">Part 1: Outbound Request Flow - Automatic Trace ID Injection</text>
            <text x="570" y="50" text-anchor="middle" font-size="14" fill="#666" font-family="Arial, sans-serif">How Pixie injects trace IDs into HTTP requests for distributed tracing</text>
            
            <!-- Background layers -->
            <rect x="70" y="70" width="1070" height="100" fill="#e8f5e8" stroke="#27ae60" stroke-width="2" rx="8"/>
            <text x="605" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60" font-family="Arial, sans-serif">Userspace Applications</text>
            
            <rect x="70" y="190" width="1070" height="320" fill="#e3f2fd" stroke="#2196f3" stroke-width="2" rx="8"/>
            <text x="605" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">Kernel Space</text>
            
            <!-- Applications -->
            <rect x="100" y="100" width="140" height="50" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
            <text x="170" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">Frontend Service</text>
            <text x="170" y="135" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Initiates HTTP Request</text>
            
            <rect x="960" y="100" width="140" height="50" fill="#4caf50" stroke="#2e7d32" stroke-width="2" rx="5"/>
            <text x="1030" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">Pixie Agent</text>
            <text x="1030" y="135" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Trace Visualization</text>
            
            <!-- Kernel Components -->
            <rect x="100" y="230" width="140" height="50" fill="#ff7043" stroke="#d84315" stroke-width="2" rx="5"/>
            <text x="170" y="245" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">kprobe/tcp_sendmsg</text>
            <text x="170" y="260" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Send Message Hook</text>
            <text x="170" y="275" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Socket Buffer Access</text>
            
            <rect x="300" y="230" width="140" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
            <text x="370" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">Pixie eBPF</text>
            <text x="370" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">Program (PeP)</text>
            <text x="370" y="270" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">HTTP Parsing</text>
            <text x="370" y="280" text-anchor="middle" font-size="7" fill="white" font-family="Arial, sans-serif">bpf_probe_read_user()</text>
            
            <rect x="520" y="230" width="140" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
            <text x="590" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">PeP Header Check</text>
            <text x="590" y="255" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Check for X-Trace-ID</text>
            <text x="590" y="270" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">bpf_skb_load_bytes()</text>
            
            <rect x="740" y="230" width="140" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
            <text x="810" y="238" text-anchor="middle" font-size="9" font-weight="bold" fill="white" font-family="Arial, sans-serif">PeP Trace Generation</text>
            <text x="810" y="252" text-anchor="middle" font-size="9" font-weight="bold" fill="white" font-family="Arial, sans-serif">& Injection</text>
            <text x="810" y="266" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Generate ID & Inject Header</text>
            <text x="810" y="278" text-anchor="middle" font-size="7" fill="white" font-family="Arial, sans-serif">bpf_skb_store_bytes()</text>
            
            <!-- Network Stack -->
            <rect x="960" y="230" width="140" height="50" fill="#ff9800" stroke="#f57c00" stroke-width="2" rx="5"/>
            <text x="1030" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">Network Stack</text>
            <text x="1030" y="260" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Modified Request</text>
            <text x="1030" y="275" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">To Backend Service</text>
            
            <!-- Lower Row Blocks -->
            <!-- eBPF Maps -->
            <rect x="300" y="330" width="140" height="50" fill="#26a69a" stroke="#00695c" stroke-width="2" rx="5"/>
            <text x="370" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial, sans-serif">eBPF Maps</text>
            <text x="370" y="360" text-anchor="middle" font-size="9" fill="white" font-family="Arial, sans-serif">Trace Context Storage</text>
            <text x="370" y="375" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">PID, Container ID, Service</text>
            
            <!-- Context Correlation -->
            <rect x="740" y="330" width="140" height="50" fill="#42a5f5" stroke="#1976d2" stroke-width="2" rx="5"/>
            <text x="810" y="340" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial, sans-serif">PeP Context Storage</text>
            <text x="810" y="355" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Store Trace Context</text>
            <text x="810" y="368" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">Process Correlation</text>
            <text x="810" y="381" text-anchor="middle" font-size="8" fill="white" font-family="Arial, sans-serif">bpf_map_update_elem()</text>
            
            <!-- Flow Arrows -->
            <line x1="170" y1="150" x2="170" y2="230" stroke="#4caf50" stroke-width="3" marker-end="url(#green-arrow)"/>
            <text x="155" y="180" text-anchor="middle" font-size="9" fill="#4caf50" font-weight="bold" font-family="Arial, sans-serif">HTTP request</text>
            <circle cx="170" cy="190" r="8" fill="#fff" stroke="#4caf50" stroke-width="2"/>
            <text x="170" y="195" text-anchor="middle" font-size="9" font-weight="bold" fill="#4caf50" font-family="Arial, sans-serif">1</text>
            
            <line x1="240" y1="255" x2="300" y2="255" stroke="#ff7043" stroke-width="3" marker-end="url(#orange-arrow)"/>
            <text x="270" y="275" text-anchor="middle" font-size="9" fill="#ff7043" font-weight="bold" font-family="Arial, sans-serif">triggers</text>
            <circle cx="270" cy="255" r="8" fill="#fff" stroke="#ff7043" stroke-width="2"/>
            <text x="270" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff7043" font-family="Arial, sans-serif">2</text>
            
            <line x1="440" y1="255" x2="520" y2="255" stroke="#2196f3" stroke-width="3" marker-end="url(#blue-arrow)"/>
            <text x="480" y="275" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif">checks</text>
            <circle cx="480" cy="255" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="480" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">3</text>
            
            <!-- Simultaneous arrow to Context Storage -->
            <line x1="440" y1="275" x2="740" y2="355" stroke="#2196f3" stroke-width="3" marker-end="url(#blue-arrow)"/>
            <text x="660" y="320" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(15 660 320)">correlates</text>
            <circle cx="650" cy="331" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="650" y="336" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">3</text>
            
            <!-- Connect Header Check to eBPF Maps - REMOVED (not technically accurate) -->
            
            <line x1="660" y1="255" x2="740" y2="255" stroke="#2196f3" stroke-width="3" marker-end="url(#blue-arrow)"/>
            <text x="700" y="275" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif">generates</text>
            <circle cx="700" cy="255" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="700" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">5</text>
            
            <!-- Connect Trace Generation to Context Storage -->
            <line x1="810" y1="280" x2="810" y2="330" stroke="#2196f3" stroke-width="2" marker-end="url(#blue-arrow)"/>
            <text x="795" y="305" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(-90 795 305)">correlates</text>
            <circle cx="810" cy="305" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="810" y="310" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">7</text>

            <!-- Connect Trace Generation to eBPF Maps - NEW -->
            <line x1="740" y1="275" x2="440" y2="345" stroke="#2196f3" stroke-width="2" marker-end="url(#blue-arrow)"/>
            <text x="520" y="350" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(-13 520 350)">stores</text>
            <circle cx="520" cy="326" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="520" y="331" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">6</text>
            
            <!-- Connect Trace Injection to Network Stack -->
            <line x1="880" y1="255" x2="960" y2="255" stroke="#ff9800" stroke-width="3" marker-end="url(#orange-arrow)"/>
            <text x="920" y="275" text-anchor="middle" font-size="9" fill="#ff9800" font-weight="bold" font-family="Arial, sans-serif">transmits</text>
            <circle cx="920" cy="255" r="8" fill="#fff" stroke="#ff9800" stroke-width="2"/>
            <text x="920" y="260" text-anchor="middle" font-size="9" font-weight="bold" fill="#ff9800" font-family="Arial, sans-serif">8</text>
            
            <!-- Connect Context Storage to Pixie Agent -->
            <line x1="810" y1="330" x2="1030" y2="150" stroke="#2196f3" stroke-width="2" marker-end="url(#blue-arrow)"/>
            <text x="950" y="185" text-anchor="middle" font-size="9" fill="#2196f3" font-weight="bold" font-family="Arial, sans-serif" transform="rotate(-35 950 185)">export trace data</text>
            <circle cx="960" cy="207" r="8" fill="#fff" stroke="#2196f3" stroke-width="2"/>
            <text x="960" y="212" text-anchor="middle" font-size="9" font-weight="bold" fill="#2196f3" font-family="Arial, sans-serif">9</text>
            
            <!-- Process Flow Labels -->
            <text x="570" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a237e" font-family="Arial, sans-serif">Process Flow:</text>
            <text x="120" y="420" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">1. Frontend Service initiates HTTP request</text>
            <text x="120" y="435" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">2. kprobe/tcp_sendmsg hook intercepts socket buffer</text>
            <text x="120" y="450" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">3. Pixie eBPF program checks headers and correlates process context</text>
            <text x="120" y="465" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">4. Header check examines HTTP request for existing X-Trace-ID</text>
            <text x="635" y="420" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">5. Trace generation & injection creates trace ID (if missing) and injects it</text>
            <text x="635" y="435" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">6. Trace context stored in eBPF Maps with process metadata</text>
            <text x="635" y="450" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">7. Context storage correlates trace data for export</text>
            <text x="635" y="465" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">8. Network stack transmits modified request with trace ID</text>
            <text x="635" y="480" font-size="10" fill="#1a237e" font-family="Arial, sans-serif">9. Context storage exports complete trace data to Pixie Agent</text>
          </g>
          
          <!-- COLOR LEGEND -->
          <g transform="translate(150, 560)">
            <text x="420" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" font-family="Arial, sans-serif">Color Legend</text>
            
            <!-- Row 1 -->
            <rect x="0" y="15" width="18" height="15" fill="#4caf50" stroke="#2e7d32" stroke-width="1" rx="3"/>
            <text x="25" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">Userspace Applications</text>
            
            <rect x="200" y="15" width="18" height="15" fill="#26a69a" stroke="#00695c" stroke-width="1" rx="3"/>
            <text x="225" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">eBPF Maps (Kernel Storage)</text>
            
            <rect x="420" y="15" width="18" height="15" fill="#ff7043" stroke="#d84315" stroke-width="1" rx="3"/>
            <text x="445" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">Kernel Hooks (kprobe)</text>
            
            <rect x="640" y="15" width="18" height="15" fill="#ff9800" stroke="#f57c00" stroke-width="1" rx="3"/>
            <text x="665" y="26" font-size="11" fill="#333" font-family="Arial, sans-serif">Network Stack</text>
            
            <!-- Row 2 -->
            <rect x="100" y="40" width="18" height="15" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="3"/>
            <text x="125" y="51" font-size="11" fill="#333" font-family="Arial, sans-serif">Pixie eBPF Program and Its Functions</text>
          </g>
          
          <!-- Attribution -->
          <text x="980" y="580" font-size="10" fill="#7f8c8d" font-style="italic" font-family="Arial, sans-serif">Abdullah Mohammed</text>
        </svg>
    </div>
</body>
</html>
